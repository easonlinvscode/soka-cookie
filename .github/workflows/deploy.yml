name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCMgCDeXQimd4JSS0zXipssXnC_QVZfLdU
          VITE_FIREBASE_AUTH_DOMAIN: soka-cookie.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: soka-cookie
          VITE_FIREBASE_STORAGE_BUCKET: soka-cookie.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: 136929266965
          VITE_FIREBASE_APP_ID: 1:136929266965:web:b3fa3080e2d264d337ad1c
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
